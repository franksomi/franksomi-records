<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track your repair — Franksomi Solution Ltd</title>
<link rel="icon" href="logo.png"><link rel="stylesheet" href="style.css">
<style>
 body{min-height:100vh}.pw{max-width:560px;margin:auto;padding:16px}.pw header{border-radius:12px;margin-bottom:16px}
 .steps{list-style:none;margin:16px 0;padding:0}.steps li{display:flex;gap:12px;align-items:flex-start;padding:8px 0;position:relative;color:var(--mut)}
 .steps li:before{content:"";width:22px;height:22px;border-radius:50%;border:2px solid var(--line);background:var(--card);flex:none;margin-top:1px}
 .steps li.done{color:var(--txt)}.steps li.done:before{background:#12b76a;border-color:#12b76a}
 .steps li.cur{color:var(--txt);font-weight:600}.steps li.cur:before{background:var(--orange);border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,145,77,.25)}
 .steps small{display:block;font-weight:400;color:var(--mut)}
 .big{font-size:22px;font-weight:700}.note{background:rgba(13,110,174,.1);border-left:4px solid var(--blue);padding:10px 12px;border-radius:6px;margin:12px 0}
 .row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}.msg{min-height:1.4em;margin:8px 0}
 .ok{color:#067647}.bad{color:#b42318}.row b,.pw .card .row b{font-size:inherit;display:inline;margin:0}
</style></head><body>
<div class="pw">
  <header class="hero" style="padding:16px 20px"><div class="row1"><img src="logo.png" alt="" height="52" width="52"><div><h2 style="font-size:19px">Franksomi Solution Ltd</h2><p>Track your repair</p><span class="tagline" style="margin-top:4px">For Quality Solutions in Tech</span></div></div></header>
  <form id="f" class="card" style="display:grid;gap:12px">
    <label>Job card or job number (on your receipt or job card, e.g. JC-0001 or J-001)<input name="job" required autocomplete="off" inputmode="text" placeholder="JC-0001 or J-001"></label>
    <label>Phone number you gave us<input name="phone" required type="tel" inputmode="tel" placeholder="07XX XXX XXX"></label>
    <button class="btn">Check status</button><p id="err" class="msg bad"></p>
  </form>
  <div id="out" hidden></div>
  <p style="color:var(--mut);font-size:13px;text-align:center">Questions? Call <a href="tel:0711952924">0711 952 924</a> · franksomi@gmail.com</p>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<script src="brand.js"></script>
<script src="vendor/pdf-lib.min.js"></script>
<script src="pdf.js"></script>
<script src="portal.js"></script>
</body></html>
